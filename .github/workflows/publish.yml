name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Pinned: npm 11.5.1 is the first version with npm Trusted Publishing (OIDC) support.
      - run: npm install -g npm@11.5.1
      - run: npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:bin
      - run: npm run check:pack-install
      # Auth via npm Trusted Publishing (OIDC): the @v1design/cli package on npmjs
      # must list this repo + workflow file as a trusted publisher. No tokens or secrets.
      - name: Publish to npm
        run: npm publish --access public --provenance
